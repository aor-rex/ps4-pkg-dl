name: Release (Linux AppImage beta)

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            renderer/package-lock.json

      - name: Build renderer UI
        run: |
          npm ci --prefix renderer
          npm run build --prefix renderer

      - name: Install + rebuild natives for Electron
        run: |
          npm ci
          npm run rebuild

      - name: Build AppImage
        run: npm run dist

      - name: Extract changelog section
        run: |
          TAG="${GITHUB_REF_NAME}"
          awk -v tag="## [$TAG]" 'index($0,tag)==1{flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md > release-notes.md
          echo "" >> release-notes.md
          echo "**Full Changelog**: https://github.com/${{ github.repository }}/commits/$TAG" >> release-notes.md

      - name: Publish beta release
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          prerelease: true
          body_path: release-notes.md
          files: dist/*.AppImage
