# Mirror of the GitHub tag release (AppImage + yml) onto GitLab Releases.
# The in-app updater keeps using GitHub as its source; this is redundancy.
# Triggers on version tags only (v*), matching .github/workflows/release.yml.
workflow:
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
    - when: never

release-appimage:
  image: node:20
  rules:
    - if: $CI_COMMIT_TAG =~ /^v/
  cache:
    key:
      files:
        - package-lock.json
        - renderer/package-lock.json
    paths:
      - .npm/
  before_script:
    - apt-get update -qq && apt-get install -y -qq python3 make g++ git > /dev/null
    - npm config set cache .npm --global
  script:
    - npm ci --prefix renderer --cache .npm --prefer-offline
    - npm run build --prefix renderer
    - npm ci --cache .npm --prefer-offline
    - npm run rebuild
    - npm run dist
    - |
      TAG="$CI_COMMIT_TAG"
      awk -v tag="## [$TAG]" 'index($0,tag)==1{flag=1;next} /^## \[/{flag=0} flag' CHANGELOG.md > release-notes.md
      echo "" >> release-notes.md
      echo "**Full Changelog**: https://gitlab.com/${CI_PROJECT_PATH}/-/compare/${TAG}" >> release-notes.md
      echo "notes lines: $(wc -l < release-notes.md)"
    - ls dist/*.AppImage dist/latest-linux.yml
    - cp dist/PS4-PKG-Downloader-*.AppImage dist/PS4-PKG-Downloader.AppImage
  artifacts:
    paths:
      - dist/PS4-PKG-Downloader.AppImage
      - dist/latest-linux.yml
    expire_in: 1 week
  release:
    tag_name: $CI_COMMIT_TAG
    name: $CI_COMMIT_TAG
    description: release-notes.md
    assets:
      links:
        - name: PS4-PKG-Downloader AppImage
          filepath: /dist/PS4-PKG-Downloader.AppImage
        - name: latest-linux.yml
          filepath: /dist/latest-linux.yml
